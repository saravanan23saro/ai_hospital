groups:
  - name: careflow
    rules:
      - alert: CareFlowApiUnavailable
        expr: up{job="hospital-api"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "CareFlow API is unavailable"}
      - alert: CareFlowAiUnavailable
        expr: up{job="hospital-ai"} == 0
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Advisory AI is unavailable; deterministic fallback should be active"}
      - alert: CareFlowApiHighErrorRate
        expr: sum(rate(http_server_requests_seconds_count{job="hospital-api",status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{job="hospital-api"}[5m])), 0.001) > 0.02
        for: 10m
        labels: {severity: critical}
        annotations: {summary: "API 5xx rate exceeds 2%"}
      - alert: CareFlowApiHighLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job="hospital-api"}[5m]))) > 1
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "API p95 latency exceeds one second"}
