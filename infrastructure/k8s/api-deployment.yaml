apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: careflow-hospital
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: careflow/hospital-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: careflow-config
            - secretRef:
                name: careflow-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1536Mi"
              cpu: "2000m"
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: careflow-hospital
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: api
