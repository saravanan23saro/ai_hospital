spring:
  application.name: hospital-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hospital}
    username: ${DATABASE_USERNAME:hospital}
    password: ${DATABASE_PASSWORD:hospital-dev-only}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway.locations: classpath:db/migration
  data.redis.host: ${REDIS_HOST:localhost}
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
server:
  error.include-stacktrace: never
  error.include-message: never
hospital:
  environment: ${HOSPITAL_ENVIRONMENT:production}
  timezone: ${HOSPITAL_TIMEZONE:Asia/Kolkata}
  ai-service-url: ${AI_SERVICE_URL:http://localhost:8000}
  web-origin: ${WEB_ORIGIN:http://localhost:3200}
  auth-rate-limit-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:20}
  outbox-delay-ms: ${OUTBOX_DELAY_MS:5000}
  bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
  bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  payments:
    provider: ${PAYMENT_PROVIDER:mock}
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:mock_rzp_key}
      key-secret: ${RAZORPAY_KEY_SECRET:mock_rzp_secret}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:mock_rzp_wh_secret}
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:mock_stripe_key}
      publishable-key: ${STRIPE_PUBLISHABLE_KEY:mock_stripe_pub}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:mock_stripe_wh_secret}
  notifications:
    email-provider: ${EMAIL_PROVIDER:log}
    sms-provider: ${SMS_PROVIDER:log}

