apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: careflow-hospital
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: careflow/hospital-web:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: careflow-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: careflow-hospital
spec:
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: web
