services:
  # 1. Python FastAPI AI Advisory Service
  - type: web
    name: careflow-ai-service
    env: docker
    dockerfilePath: ./apps/ai-service/Dockerfile
    dockerContext: ./apps/ai-service
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000

  # 2. Java Spring Boot API Monolith
  - type: web
    name: careflow-api
    env: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    plan: free
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: careflow-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: careflow-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: careflow-db
          property: password
      - key: REDIS_HOST
        fromService:
          type: redis
          name: careflow-redis
          property: host
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: careflow-ai-service
          property: url
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: admin@careflow.local
      - key: BOOTSTRAP_ADMIN_PASSWORD
        value: CareFlowAdmin!2026
      - key: HOSPITAL_ENVIRONMENT
        value: production
      - key: HOSPITAL_TIMEZONE
        value: Asia/Kolkata
      - key: WEB_ORIGIN
        sync: false

databases:
  # 3. PostgreSQL Database
  - name: careflow-db
    databaseName: hospital
    user: hospital
    plan: free
